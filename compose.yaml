# Local development only. This is the project's own Postgres, on a non-default
# port so it cannot clash with other instances on the machine. Settings come
# from .env at the repository root, which Compose reads automatically.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodies}
      POSTGRES_DB: ${POSTGRES_DB:-foodies}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
