# Local development only. Uses a non-default port to avoid clashing with other
# Postgres instances on the machine.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: foodies
      POSTGRES_PASSWORD: foodies
      POSTGRES_DB: foodies
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodies -d foodies"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
