services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodies
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
      POSTGRES_DB: foodies
    volumes:
      - foodies-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodies -d foodies"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dokploy-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrate
    restart: "no"
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://foodies:${POSTGRES_PASSWORD}@postgres:5432/foodies?sslmode=disable
      GOOSE_MIGRATION_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dokploy-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://foodies:${POSTGRES_PASSWORD}@postgres:5432/foodies?sslmode=disable
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in Dokploy}
      UPLOAD_DIR: /data/uploads
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL in Dokploy}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    volumes:
      - foodies-uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: https://foodies.spiritusglobal.tech/api/v1
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "3000"
    networks:
      - dokploy-network

volumes:
  foodies-postgres:
  foodies-uploads:

networks:
  dokploy-network:
    external: true
