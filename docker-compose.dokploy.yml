services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: migrate
    restart: "no"
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:?Set DATABASE_URL in Dokploy}
      GOOSE_MIGRATION_DIR: /app/migrations
    networks:
      - dokploy-network

  seed:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: seed
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Dokploy}
      LOAD_DEMO_DATA: ${LOAD_DEMO_DATA:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      SEED_PIN: ${SEED_PIN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - dokploy-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Dokploy}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET in Dokploy}
      UPLOAD_DIR: /data/uploads
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL in Dokploy}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    volumes:
      - foodies-uploads:/data/uploads
    depends_on:
      seed:
        condition: service_completed_successfully
    expose:
      - "8080"
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: https://foodies.spiritusglobal.tech/api/v1
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE_URL: http://api:8080/api/v1
    depends_on:
      - api
    expose:
      - "3000"
    networks:
      - dokploy-network

volumes:
  foodies-uploads:

networks:
  dokploy-network:
    external: true
